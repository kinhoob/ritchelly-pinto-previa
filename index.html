<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritchelly Pinto | Advocacia</title>
<style>:root { --rp-wine:#7a2d52; --rp-deep:#430f28; --rp-ink:#2a0f1c; --rp-rose:#f9e8f1; --rp-cream:#fbf5f1; --rp-gold:#c9a36b; --rp-mute:#6e5560; }
html { scroll-behavior: smooth; }
html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--rp-cream); }
.rp-page { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--rp-ink); background: var(--rp-cream); overflow-x: hidden; line-height: 1.6; }
.rp-page * { box-sizing: border-box; }
.rp-page h1, .rp-page h2, .rp-page h3, .rp-brand span span, .rp-mono { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; }
.rp-page h1 { font-size: clamp(2rem, 5.2vw, 3.6rem); line-height: 1.1; margin: 0 0 18px; letter-spacing: -0.01em; }
.rp-page h1 em { color: var(--rp-wine); font-style: italic; }
.rp-page h2 { font-size: clamp(1.6rem, 3.6vw, 2.4rem); line-height: 1.15; margin: 0 0 20px; color: var(--rp-deep); }
.rp-page h3 { margin: 6px 0; font-size: 1.15rem; }
.rp-page p { margin: 0 0 14px; }
.rp-eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: .75rem; color: var(--rp-wine); margin-bottom: 10px !important; font-weight: 600; }
.rp-note { font-size: .85rem; color: var(--rp-mute); }

.rp-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px clamp(16px, 5vw, 64px); background: rgba(251,245,241,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #ecdce3; }
.rp-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--rp-deep); font-size: 1.05rem; line-height: 1.15; }
.rp-brand small { display: block; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--rp-mute); font-family: 'Segoe UI', system-ui, sans-serif; }
.rp-mono { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--rp-wine); color: #fff; font-size: .95rem; letter-spacing: .04em; border: 1px solid var(--rp-gold); flex: none; }
.rp-nav { display: flex; align-items: center; gap: 22px; }
.rp-nav a:not(.rp-btn) { color: var(--rp-ink); text-decoration: none; font-size: .95rem; position: relative; }
.rp-nav a:not(.rp-btn)::after { content: ''; position: absolute; left: 0; bottom: -4px; height: 1px; width: 0; background: var(--rp-wine); transition: width .3s; }
.rp-nav a:not(.rp-btn):hover::after { width: 100%; }
.rp-burger { display: none; width: 44px; height: 44px; border: 0; background: transparent; position: relative; cursor: pointer; }
.rp-burger i { position: absolute; left: 10px; right: 10px; height: 2px; background: var(--rp-deep); transition: transform .3s; }
.rp-burger i:first-child { top: 17px; } .rp-burger i:last-child { top: 25px; }
.rp-burger[aria-expanded="true"] i:first-child { transform: translateY(4px) rotate(45deg); }
.rp-burger[aria-expanded="true"] i:last-child { transform: translateY(-4px) rotate(-45deg); }

.rp-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px; border-radius: 999px; background: var(--rp-wine); color: #fff; text-decoration: none; font-weight: 600; font-size: .98rem; position: relative; overflow: hidden; border: 1px solid var(--rp-wine); transition: transform .25s, box-shadow .25s, background .25s; }
.rp-btn::after { content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); animation: rp-shine 4.5s ease-in-out infinite; }
.rp-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(122,45,82,.28); }
.rp-btn-sm { min-height: 40px; padding: 0 18px; font-size: .88rem; }
.rp-btn-ghost { background: transparent; color: var(--rp-wine); }
.rp-btn-ghost::after { display: none; }
.rp-btn-light { background: #fff; color: var(--rp-deep); border-color: #fff; }
@keyframes rp-shine { 0%, 55% { left: -80%; } 100% { left: 140%; } }

.rp-hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; padding: clamp(32px, 6vw, 80px) clamp(16px, 5vw, 64px); background: radial-gradient(circle at 85% 20%, var(--rp-rose), transparent 55%); }
.rp-lead { font-size: 1.12rem; color: var(--rp-mute); max-width: 34em; }
.rp-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.rp-hero-art img { width: 100%; height: auto; display: block; border-radius: 20px; box-shadow: 0 30px 60px -20px rgba(67,15,40,.5); animation: rp-float 7s ease-in-out infinite; }
@keyframes rp-float { 50% { transform: translateY(-8px); } }
.rp-in { animation: rp-up .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rp-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.rp-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 clamp(16px, 5vw, 64px) 8px; }
.rp-pill { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; border: 1px solid #ecdce3; border-radius: 14px; font-size: .92rem; }
.rp-pill span { width: 8px; height: 8px; border-radius: 50%; background: var(--rp-gold); flex: none; }

.rp-sec { padding: clamp(40px, 7vw, 88px) clamp(16px, 5vw, 64px); }
.rp-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.rp-tabs button { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #dcc3d0; background: #fff; color: var(--rp-ink); font: inherit; font-size: .95rem; cursor: pointer; transition: all .25s; }
.rp-tabs button.is-on { background: var(--rp-deep); color: #fff; border-color: var(--rp-deep); }
.rp-panel { background: #fff; border: 1px solid #ecdce3; border-radius: 20px; padding: clamp(20px, 4vw, 36px); animation: rp-up .5s ease both; }
.rp-panel > p { font-size: 1.1rem; max-width: 40em; }
.rp-panel ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 24px; }
.rp-panel li { padding-left: 22px; position: relative; }
.rp-panel li::before { content: ''; position: absolute; left: 0; top: .6em; width: 10px; height: 1px; background: var(--rp-gold); box-shadow: 0 0 0 1px var(--rp-gold); }

.rp-about { display: grid; grid-template-columns: 320px 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; background: var(--rp-rose); }
.rp-crest img { width: 100%; max-width: 320px; display: block; border-radius: 20px; }

.rp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.rp-step { background: #fff; border: 1px solid #ecdce3; border-radius: 18px; padding: 22px; height: 100%; transition: transform .3s, box-shadow .3s; }
.rp-step:hover { transform: translateY(-4px); box-shadow: 0 16px 30px -16px rgba(67,15,40,.35); }
.rp-step b { font-family: Georgia, serif; color: var(--rp-gold); font-size: 1.8rem; font-weight: 500; }
.rp-step p { color: var(--rp-mute); font-size: .95rem; margin: 0; }

.rp-faq { max-width: 820px; }
.rp-q { border-bottom: 1px solid #e3cfd9; }
.rp-q button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding: 8px 0; background: none; border: 0; font: inherit; font-size: 1.05rem; text-align: left; color: var(--rp-ink); cursor: pointer; }
.rp-q i { width: 14px; height: 14px; position: relative; flex: none; }
.rp-q i::before, .rp-q i::after { content: ''; position: absolute; background: var(--rp-wine); transition: transform .3s; }
.rp-q i::before { left: 0; right: 0; top: 6px; height: 2px; } .rp-q i::after { top: 0; bottom: 0; left: 6px; width: 2px; }
.rp-q.is-open i::after { transform: scaleY(0); }
.rp-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.rp-a > div { overflow: hidden; }
.rp-a p { color: var(--rp-mute); padding-bottom: 14px; margin: 0; }
.rp-q.is-open .rp-a { grid-template-rows: 1fr; }

.rp-contact { text-align: center; padding: clamp(48px, 8vw, 96px) clamp(16px, 5vw, 64px); background: linear-gradient(135deg, var(--rp-deep), var(--rp-wine)); color: #fff; }
.rp-contact h2 { color: #fff; }
.rp-contact .rp-note { color: #e9cfdc; margin-top: 18px; }
.rp-foot { text-align: center; padding: 32px 16px 40px; background: var(--rp-ink); color: #e9d7e0; }
.rp-foot p { margin: 10px 0 6px; } .rp-foot small { display: block; max-width: 40em; margin: 0 auto; opacity: .7; }

.rp-js .rp-reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
.rp-js .rp-reveal.is-in { opacity: 1; transform: none; }

@media (max-width: 860px) {
    .rp-hero, .rp-about { grid-template-columns: 1fr; }
    .rp-grid { grid-template-columns: repeat(2, 1fr); }
    .rp-strip { grid-template-columns: repeat(2, 1fr); }
    .rp-burger { display: block; }
    .rp-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; padding: 8px 16px 16px; background: var(--rp-cream); border-bottom: 1px solid #ecdce3; }
    .rp-nav.is-open { display: flex; }
    .rp-nav a:not(.rp-btn) { padding: 14px 0; border-bottom: 1px solid #f0e3e8; }
    .rp-nav .rp-btn { margin-top: 12px; }
    .rp-crest img { max-width: 220px; }
}
@media (max-width: 520px) {
    .rp-grid, .rp-panel ul { grid-template-columns: 1fr; }
    .rp-cta .rp-btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
    .rp-in, .rp-hero-art img, .rp-btn::after { animation: none; }
    .rp-js .rp-reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div id="root"></div>
